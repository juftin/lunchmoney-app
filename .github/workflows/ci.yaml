# Continuous integration workflow for Lunch Money MCP.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - check
          - test
          - build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Install dependencies
        run: task install -- --frozen

      - name: Run ${{ matrix.task }}
        run: task ${{ matrix.task }}
