# Project-specific upstream Lunch Money compatibility checks.

name: upstream-contract

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    contract:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Set up uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: true
            - name: Set up Task
              uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
            - name: Install dependencies
              run: task install -- --locked
            - name: Run upstream contract checks
              run: task contract
