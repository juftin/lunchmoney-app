# Project-specific upstream Lunch Money compatibility checks.

name: upstream-contract

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    contract:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: true
            - name: Set up Task
              uses: go-task/setup-task@v2
            - name: Install dependencies
              run: task install -- --locked
            - name: Run upstream contract checks
              run: task contract
