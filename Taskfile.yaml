# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

env:
    UV_LOCKED: 1
vars:
    DOCKER_REPO: juftin/lunchmoney-app

includes:
    project:
        taskfile: ./tasks/ProjectTaskfile.yaml
        flatten: true

tasks:
    ########################
    # DEFAULT TASK
    ########################
    default:
        desc: List Available Tasks
        cmds:
            - task --list-all --sort alphanumeric
        silent: true
    ########################
    # INSTALL AND DEPENDENCIES
    ########################
    install:
        desc: Install Project + Dev Dependencies
        cmds:
            - task: pre-commit-install
            - task: sync
    ########################
    # TESTING
    ########################
    test:
        desc: Run Tests
        cmds:
            - uv run -- pytest {{.CLI_ARGS}}
        deps:
            - task: sync
              vars:
                  UV_PYTHON: "{{.UV_PYTHON}}"
                  CLI_ARGS: --quiet
        env:
            UV_PYTHON: "{{.UV_PYTHON}}"
    #######################################
    test:matrix:
        desc: Run Tests across Python Versions
        cmds:
            - for:
                  matrix:
                      PYTHON: ["3.10", "3.11", "3.12", "3.13", "3.14"]
              task: test
              vars:
                  UV_PYTHON: "{{.ITEM.PYTHON}}"
    ########################
    # CODE QUALITY CHECKS
    ########################
    check:format:
        desc: Code Quality Check - Formatting
        cmds:
            - task: fmt
              vars:
                  CLI_ARGS: --check
    #######################################
    check:lint:
        desc: Code Quality Check - Linting
        cmds:
            - uv run -- ruff check {{.CLI_ARGS | default .ROOT_DIR}}
        deps: [sync]
    #######################################
    check:style:
        desc: Code Quality Check - Formatting + Linting
        cmds:
            - task: check:format
            - task: check:lint
    #######################################
    check:types:
        desc: Code Quality Check - Type Checking
        cmds:
            - |
                uv run -- \
                mypy \
                  --ignore-missing-imports \
                  {{.CLI_ARGS | default (printf "%s/src" .ROOT_DIR)}}
        status:
            - '[$(uv tree --package mypy) != ""]'
    #######################################
    check:
        desc: Code Quality Check - Formatting + Linting + Type Checking
        cmds:
            - task: check:style
            - task: check:types
    ########################
    # CODE QUALITY FIXES
    ########################
    fmt:
        desc: Code Quality Auto-Fix - Formatting
        cmds:
            - uv run -- ruff format {{.CLI_ARGS | default .ROOT_DIR}}
        deps: [sync]
    #######################################
    fix:
        desc: Code Quality Auto-Fix - Formatting + Linting
        cmds:
            - task: fmt
            - uv run -- ruff check --fix {{.CLI_ARGS | default .ROOT_DIR}}
        deps: [sync]
    ########################
    # BUILD AND PUBLISH
    ########################
    dist:
        desc: Build Distribution Artifacts
        cmds:
            - cmd: rm -rf {{.ROOT_DIR}}/dist
            - cmd: uv build
    #######################################
    mcpb:
        desc: Build the Claude Desktop MCP Bundle
        cmds:
            - cmd: rm -rf {{.ROOT_DIR}}/dist/mcpb
            - cmd: mkdir -p {{.ROOT_DIR}}/dist/mcpb
            - cmd: cp {{.ROOT_DIR}}/pyproject.toml {{.ROOT_DIR}}/uv.lock {{.ROOT_DIR}}/README.md {{.ROOT_DIR}}/LICENSE {{.ROOT_DIR}}/dist/mcpb/
            - cmd: git -C {{.ROOT_DIR}} archive --format=tar HEAD src | tar -xf - -C {{.ROOT_DIR}}/dist/mcpb
            - cmd: cp {{.ROOT_DIR}}/mcpb/manifest.json {{.ROOT_DIR}}/dist/mcpb/manifest.json
            - cmd: npx --yes @anthropic-ai/mcpb@2.1.2 pack {{.ROOT_DIR}}/dist/mcpb {{.ROOT_DIR}}/dist/lunchmoney-app.mcpb
    #######################################
    mcp:verify:
        desc: Validate installable MCP bundles and registry metadata
        cmds:
            - cmd: npx --yes @anthropic-ai/claude-code@2.1.206 plugin validate {{.ROOT_DIR}} --strict
            - cmd: npx --yes @google/gemini-cli@0.46.0 extensions validate {{.ROOT_DIR}}
            - task: mcpb
            - cmd: uv run --locked --no-dev --directory {{.ROOT_DIR}}/dist/mcpb lunchmoney-app version
            - |
                VERIFY_VERSION="$(uv version --short)"
                task registry:manifest VERSION="$VERIFY_VERSION" MCPB={{.ROOT_DIR}}/dist/lunchmoney-app.mcpb MCPB_URL=https://example.com/lunchmoney-app.mcpb OUTPUT={{.ROOT_DIR}}/dist/mcp-registry/server.json
                VERIFY_DIRECTORY="$(mktemp -d)"
                trap 'rm -rf "$VERIFY_DIRECTORY"' EXIT
                case "$(uname -s)_$(uname -m)" in
                    Darwin_x86_64) PUBLISHER_ARCHIVE=mcp-publisher_darwin_amd64.tar.gz; PUBLISHER_SHA256=88126981225e7714fcc6b7a10cdba4a80ae5901e9740a8c06d0d5195c8bc294c ;;
                    Darwin_arm64) PUBLISHER_ARCHIVE=mcp-publisher_darwin_arm64.tar.gz; PUBLISHER_SHA256=e45e520892460732a4bdf37255576415d4a53ec171f8b913faf15bb1aef7cb77 ;;
                    Linux_x86_64) PUBLISHER_ARCHIVE=mcp-publisher_linux_amd64.tar.gz; PUBLISHER_SHA256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc ;;
                    Linux_aarch64) PUBLISHER_ARCHIVE=mcp-publisher_linux_arm64.tar.gz; PUBLISHER_SHA256=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4 ;;
                    *) echo "Unsupported platform: $(uname -s)_$(uname -m)" >&2; exit 1 ;;
                esac
                curl --fail --location --output "$VERIFY_DIRECTORY/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$PUBLISHER_ARCHIVE"
                echo "$PUBLISHER_SHA256  $VERIFY_DIRECTORY/mcp-publisher.tar.gz" | shasum -a 256 --check --status
                tar -xzf "$VERIFY_DIRECTORY/mcp-publisher.tar.gz" -C "$VERIFY_DIRECTORY" mcp-publisher
                "$VERIFY_DIRECTORY/mcp-publisher" validate {{.ROOT_DIR}}/mcp-registry/server.json
                "$VERIFY_DIRECTORY/mcp-publisher" validate {{.ROOT_DIR}}/dist/mcp-registry/server.json
    #######################################
    registry:manifest:
        desc: Render MCP Registry metadata for a built MCPB release artifact
        cmds:
            - uv run -- python scripts/render_mcp_registry_manifest.py --version {{.VERSION}} --mcpb {{.MCPB}} --mcpb-url {{.MCPB_URL}} --output {{.OUTPUT}}
        requires:
            vars: [VERSION, MCPB, MCPB_URL, OUTPUT]
    #######################################
    docker:
        desc: Build Docker Image
        cmd: |
            docker buildx build \
              --tag {{.DOCKER_REPO}}:{{.RELEASE_VERSION}} \
              --tag {{.DOCKER_REPO}}:latest \
              --file {{.ROOT_DIR}}/Dockerfile \
              {{.CLI_ARGS | default ""}} \
              {{.ROOT_DIR}}
        vars:
            RELEASE_VERSION:
                ref: .RELEASE_VERSION | default "local"
        requires:
            vars: [DOCKER_REPO]
        status:
            - test ! -f {{.ROOT_DIR}}/{{.DOCKERFILE | default "Dockerfile"}}
    #######################################
    build:
        desc: Build Project Artifacts
        cmds:
            - task: dist
            - task: docker
    #######################################
    publish:
        desc: Publish Docker Image
        cmds:
            - task: docker
              vars:
                  CLI_ARGS: --push
        requires:
            vars: [CI, RELEASE_VERSION]
        status:
            - test ! -f {{.ROOT_DIR}}/{{.DOCKERFILE | default "Dockerfile"}}
    ########################
    # DOCUMENTATION AND COMMANDS
    ########################
    docs:
        desc: Run Documentation Site
        cmds:
            - uv run --group docs -- mkdocs {{.CLI_ARGS | default "serve"}}
    #######################################
    run:
        desc: Run Project Command (requires "--")
        interactive: true
        cmds:
            - uv run -- {{.CLI_ARGS}}
    #######################################
    docker-run:
        desc: Run Docker Command (requires "--")
        interactive: true
        cmds:
            - |
                docker run \
                  --rm -it \
                  {{.DOCKER_REPO}}:{{.DOCKER_TAG_PREFIX}}{{.RELEASE_VERSION}} \
                  {{.CLI_ARGS}}
        deps: ["docker"]
        vars:
            RELEASE_VERSION:
                ref: .RELEASE_VERSION | default "local"
        status:
            - test ! -f {{.ROOT_DIR}}/{{.DOCKERFILE | default "Dockerfile"}}
        requires:
            vars: [DOCKER_REPO]
    ########################
    # DEPENDENCY MANAGEMENT
    ########################
    lock:
        desc: Regenerate Project Lockfile
        cmds:
            - uv lock
        env:
            UV_LOCKED: "0"
    ########################
    # INTERNAL TASKS
    ########################
    sync:
        desc: Install Project Dependencies
        internal: true
        cmds:
            - uv sync --all-extras {{.CLI_ARGS}}
        env:
            UV_PYTHON: "{{.UV_PYTHON}}"
    #######################################
    pre-commit-install:
        desc: Install Pre-Commit Hooks
        internal: true
        cmds:
            - cmd: |
                  if [ "{{.CI | default 0}}" = "0" ]; then
                      uv tool run --isolated pre-commit install --install-hooks
                  fi
              silent: true
        status:
            - test ! -f {{.ROOT_DIR}}/.pre-commit-config.yaml
