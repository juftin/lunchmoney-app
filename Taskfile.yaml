version: "3"

vars:
  PYTHON_SRC: src/
  PYTHON_TESTS: tests/
  PYTHON_NOTEBOOKS: notebooks/
  PYTHON_SCRIPTS: scripts/
  IMAGE_NAME: lunchmoney-mcp

tasks:
  install:
    desc: Install project and development dependencies and git hooks
    cmds:
      - uv sync {{.CLI_ARGS}}
      - uv run pre-commit install

  lock:
    desc: Regenerate uv.lock
    cmds:
      - uv lock {{.CLI_ARGS}}

  fix:
    desc: Code quality auto-fix - formatting + linting
    cmds:
      - uv run ruff format {{.PYTHON_SRC}} {{.PYTHON_TESTS}} {{.PYTHON_NOTEBOOKS}} {{.PYTHON_SCRIPTS}} {{.CLI_ARGS}}
      - uv run ruff check --fix {{.PYTHON_SRC}} {{.PYTHON_TESTS}} {{.PYTHON_NOTEBOOKS}} {{.PYTHON_SCRIPTS}} {{.CLI_ARGS}}

  lint:
    desc: Code quality check - formatting + linting
    cmds:
      - uv run ruff format --check {{.PYTHON_SRC}} {{.PYTHON_TESTS}} {{.PYTHON_NOTEBOOKS}} {{.PYTHON_SCRIPTS}} {{.CLI_ARGS}}
      - uv run ruff check {{.PYTHON_SRC}} {{.PYTHON_TESTS}} {{.PYTHON_NOTEBOOKS}} {{.PYTHON_SCRIPTS}} {{.CLI_ARGS}}

  check:
    desc: Code quality check - type checking
    cmds:
      - uv run ty check {{.CLI_ARGS}}

  test:
    desc: Testing - PyTest
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  upstream:check:
    desc: Verify the pinned Lunch Money OpenAPI specification and generated client
    cmds:
      - uv run python scripts/check_upstream_contract.py

  upstream:refresh:
    desc: Refresh the reviewed Lunch Money OpenAPI contract snapshot
    cmds:
      - uv run python scripts/check_upstream_contract.py --write

  contract:
    desc: Run static and official mock-service compatibility checks
    cmds:
      - task upstream:check
      - RUN_LUNCHMONEY_CONTRACT_TESTS=1 uv run pytest -m upstream_contract

  build:
    desc: Artifact building - Docker image
    cmds:
      - docker build -t {{.IMAGE_NAME}}:latest . {{.CLI_ARGS}}

  compose:
    desc: Run application and infrastructure services with Docker Compose
    cmds:
      - docker compose up --build {{.CLI_ARGS}}

  compose:down:
    desc: Stop Docker Compose services
    cmds:
      - docker compose down {{.CLI_ARGS}}

  dev:
    desc: Run development server with FastAPI CLI
    cmds:
      - uv run fastapi dev src/lunchmoney_mcp/app/main.py {{.CLI_ARGS}}

  notebook:
    desc: Run interactive marimo notebook
    cmds:
      - uv run marimo edit notebooks/example_usage.py {{.CLI_ARGS}}

  run:
    desc: Run a command in the project environment
    cmds:
      - uv run {{.CLI_ARGS}}
