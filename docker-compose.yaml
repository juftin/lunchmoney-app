services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunchmoney-mcp
    ports:
      - "8000:8000"
    environment:
      LUNCHMONEY_DATABASE_URL: postgresql+asyncpg://lunchmoney:lunchmoney@postgres:5432/lunchmoney
      REDIS_URL: redis://redis:6379/0
      LUNCHMONEY_ACCESS_TOKEN: ${LUNCHMONEY_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: lunchmoney-postgres
    environment:
      POSTGRES_USER: lunchmoney
      POSTGRES_PASSWORD: lunchmoney
      POSTGRES_DB: lunchmoney
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchmoney -d lunchmoney"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lunchmoney-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
