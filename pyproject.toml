[project]
name = "lunchmoney-mcp"
version = "0.1.0"
description = "Lunch Money Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.139.2",
    "lunchmoney-python-async==2.25.0",
    "sqlmodel==0.0.39",
    "aiosqlite>=0.22.1,<0.23.0",
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<0.32.0",
    "fastmcp>=3.4.4,<4",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "filelock>=3.32.0",
    "redis>=8.0.1",
    "toons>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]
